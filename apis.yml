aid: epic-bio
name: Epic Bio
description: 'Epic Bio (legally Epicrispr Biotechnologies, Inc.) is a clinical-stage
  genetic medicines company in South San Francisco, California, founded in 2018 by
  Stanford CRISPR pioneer Stanley Qi, Ph.D. It develops epigenetic editing therapies
  that modulate gene expression without cutting DNA, built on its proprietary Gene
  Expression Modulation System (GEMS) platform — a combination of ultracompact DNA-binding
  proteins (CasMINI, CasONYX), tailored guide RNAs, and a large library of transcriptional
  and epigenomic modulators. Its lead program EPI-321 is in first-in-human clinical
  study for facioscapulohumeral muscular dystrophy (FSHD), with preclinical programs
  in alpha-1 antitrypsin deficiency and heterozygous familial hypercholesterolemia.
  The company is a therapeutics developer, not a software vendor: it publishes a corporate
  and scientific website but no developer program, public API, SDK, or machine-readable
  specification.'
